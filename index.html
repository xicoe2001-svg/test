<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panteón Griego — Árbol Genealógico Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --marble:#f5f0e8;--marble2:#ede7db;--marble3:#e4ddd0;
  --parchment:#faf6ee;--parchment-dark:#efe9da;
  --gold:#b8941f;--gold-light:#d4b044;--gold-dark:#8a6e14;--gold-pale:#e8d48a;
  --bronze:#a0784c;--bronze-light:#c49a6c;
  --navy:#1a2744;--navy-light:#2a3d66;--navy-med:#3a5088;
  --wine:#6b2c3e;--wine-light:#8a3d52;
  --olive:#4a5a2a;--olive-light:#6a7a42;
  --sky:#5a8aaa;--sky-light:#7aaaca;
  --earth:#7a6a4a;
  --text:#2a2418;--text-med:#5a4e3a;--text-light:#8a7e6a;
  --shadow:rgba(42,36,24,.12);
}
html{scroll-behavior:smooth}
body{
  font-family:'Cormorant Garamond',serif;
  background:var(--marble);color:var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(ellipse at 30% 10%,rgba(184,148,31,.06),transparent 50%),
    radial-gradient(ellipse at 70% 90%,rgba(90,138,170,.06),transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0v60M0 30h60' stroke='%23d4c9b4' stroke-width='.3' opacity='.2'/%3E%3C/svg%3E");
}

.container{max-width:1200px;margin:0 auto;padding:20px 16px}

/* HEADER */
header{text-align:center;padding:50px 20px 30px;position:relative}
header::before{
  content:'';display:block;width:120px;height:2px;margin:0 auto 24px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
header h1{
  font-family:'Cinzel Decorative',serif;font-weight:900;
  font-size:clamp(1.8rem,5vw,3.2rem);
  background:linear-gradient(135deg,var(--gold-dark),var(--gold-light),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:.12em;text-transform:uppercase;
}
header .subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1rem,2.5vw,1.3rem);font-weight:300;
  color:var(--text-med);margin-top:8px;font-style:italic;letter-spacing:.08em;
}
.greek-border{
  width:min(400px,80%);height:12px;margin:20px auto 0;
  background:url("data:image/svg+xml,%3Csvg width='24' height='12' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 6Q3 0 6 6T12 6T18 6T24 6' fill='none' stroke='%23b8941f' stroke-width='1.2' opacity='.5'/%3E%3C/svg%3E") repeat-x;
}

/* TIER SECTIONS */
.tier{margin:28px 0;position:relative}
.tier-header{
  display:flex;align-items:center;gap:16px;justify-content:center;
  margin-bottom:18px;
}
.tier-header h2{
  font-family:'Cinzel',serif;font-weight:700;
  font-size:clamp(.85rem,2vw,1.05rem);
  color:var(--gold-dark);text-transform:uppercase;letter-spacing:.18em;
  white-space:nowrap;
}
.tier-header::before,.tier-header::after{
  content:'';flex:1;max-width:100px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-pale),transparent);
}
.tier-sub{
  text-align:center;font-size:.9rem;color:var(--text-light);
  font-style:italic;margin-top:-12px;margin-bottom:14px;
}

/* CONNECTOR LINES */
.connector{display:flex;justify-content:center;padding:4px 0}
.conn-line{
  width:1px;height:24px;
  background:linear-gradient(180deg,var(--gold-pale),transparent);
}
.conn-label{
  text-align:center;padding:4px 0;
}
.conn-label span{
  font-family:'Cinzel',serif;font-size:.7rem;
  color:var(--gold-dark);letter-spacing:.15em;text-transform:uppercase;
  padding:4px 16px;
  border:1px solid var(--gold-pale);border-radius:20px;
  background:var(--parchment);
}
.branch-split{
  display:flex;justify-content:center;padding:2px 0;
}
.branch-h{width:min(300px,50%);height:1px;background:var(--gold-pale)}

/* GOD CARDS */
.gods-row{
  display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
}
.god-card{
  background:var(--parchment);
  border:1px solid var(--gold-pale);
  border-radius:10px;padding:14px 10px 12px;
  cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);
  text-align:center;position:relative;overflow:hidden;
  width:clamp(120px,18vw,145px);flex-shrink:0;
}
.god-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--card-color,var(--gold));
  opacity:.7;transition:opacity .3s;
}
.god-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(184,148,31,.03),transparent 40%);
  pointer-events:none;
}
.god-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px var(--shadow),0 0 0 1px var(--card-color,var(--gold));
}
.god-card:hover::before{opacity:1}
.god-card .icon{
  width:40px;height:40px;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--card-color,var(--gold)),color-mix(in srgb,var(--card-color,var(--gold)) 60%,white));
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.god-card .icon svg{width:22px;height:22px;fill:white;stroke:white;stroke-width:0}
.god-card .name{
  font-family:'Cinzel',serif;font-weight:700;
  font-size:clamp(.72rem,1.6vw,.85rem);
  color:var(--text);letter-spacing:.06em;display:block;
}
.god-card .domain{
  font-size:.7rem;color:var(--text-light);
  margin-top:2px;font-style:italic;display:block;line-height:1.3;
}

/* Card color variants */
.god-card[data-t="primordial"]{--card-color:var(--navy)}
.god-card[data-t="titan"]{--card-color:var(--bronze)}
.god-card[data-t="olympian1"]{--card-color:var(--gold-dark)}
.god-card[data-t="olympian2"]{--card-color:var(--sky)}
.god-card[data-t="demigod"]{--card-color:var(--wine)}

/* DETAIL OVERLAY */
.overlay{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(26,39,68,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fadeIn .25s ease;
  overflow-y:auto;
  padding:24px 16px;
}
.overlay.show{display:flex;align-items:flex-start;justify-content:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.panel{
  background:var(--parchment);
  border:1px solid var(--gold-pale);border-radius:14px;
  max-width:620px;width:100%;
  overflow
